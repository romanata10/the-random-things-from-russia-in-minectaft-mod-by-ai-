name: Build mod jar

on:
  push:
    branches: [ "**" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build mod with Gradle (ForgeGradle)
        run: ./gradlew build --no-daemon --stacktrace

      - name: Locate built jar
        id: jar
        run: |
          JAR_PATH=$(ls build/libs/*.jar | grep -v sources | head -n 1)
          echo "path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rushops-mod-jar
          path: build/libs/*.jar

      - name: Publish rolling "latest" release with the jar
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest automated build (${{ github.ref_name }} @ ${{ github.sha }})
          body: |
            Automatically built by GitHub Actions from commit ${{ github.sha }} on branch `${{ github.ref_name }}`.

            Download **${{ steps.jar.outputs.name }}** below and drop it into your `.minecraft/mods` folder
            (requires Minecraft 1.20.1 + Minecraft Forge 47.x).
          prerelease: true
          files: build/libs/*.jar
